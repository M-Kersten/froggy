<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="XR Utility Explorer preview">
  <defs>
    <linearGradient id="bgx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b6cf0"/>
      <stop offset="1" stop-color="#4b3aa6"/>
    </linearGradient>
    <linearGradient id="pipe1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/><stop offset="1" stop-color="#e6a534"/>
    </linearGradient>
    <linearGradient id="pipe2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ce0c4"/><stop offset="1" stop-color="#33b49a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="450" fill="url(#bgx)"/>
  <!-- AR ground grid -->
  <g stroke="#b9aef9" stroke-width="2" opacity="0.5">
    <line x1="0" y1="250" x2="720" y2="250"/>
    <line x1="0" y1="300" x2="720" y2="300"/>
    <line x1="0" y1="360" x2="720" y2="360"/>
    <line x1="0" y1="430" x2="720" y2="430"/>
    <line x1="120" y1="250" x2="40" y2="450"/>
    <line x1="260" y1="250" x2="220" y2="450"/>
    <line x1="400" y1="250" x2="400" y2="450"/>
    <line x1="540" y1="250" x2="580" y2="450"/>
    <line x1="660" y1="250" x2="720" y2="450"/>
  </g>
  <!-- underground pipes -->
  <g opacity="0.96">
    <rect x="60" y="300" width="600" height="34" rx="17" fill="url(#pipe1)"/>
    <rect x="120" y="356" width="520" height="28" rx="14" fill="url(#pipe2)"/>
    <rect x="200" y="246" width="34" height="120" rx="17" fill="url(#pipe1)" opacity="0.85"/>
    <rect x="470" y="246" width="28" height="140" rx="14" fill="url(#pipe2)" opacity="0.85"/>
  </g>
  <!-- AR markers -->
  <g>
    <circle cx="234" cy="300" r="16" fill="#fff" opacity="0.9"/>
    <circle cx="234" cy="300" r="7" fill="#4b3aa6"/>
    <circle cx="484" cy="356" r="16" fill="#fff" opacity="0.9"/>
    <circle cx="484" cy="356" r="7" fill="#4b3aa6"/>
  </g>
  <!-- floating info card -->
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="210" height="96" rx="16" fill="#ffffff" opacity="0.92"/>
    <rect x="18" y="20" width="120" height="14" rx="7" fill="#7b6cf0"/>
    <rect x="18" y="46" width="174" height="9" rx="4.5" fill="#cfc9f2"/>
    <rect x="18" y="62" width="140" height="9" rx="4.5" fill="#cfc9f2"/>
  </g>
  <text x="40" y="64" font-family="Poppins, Verdana, sans-serif" font-size="40" font-weight="700" fill="#fbf9ff">XR Utility Explorer</text>
</svg>
