<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="Vision Pro Prototype preview">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#3a9fe0"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2f3a"/>
      <stop offset="1" stop-color="#13151c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dff1ff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="720" height="450" fill="url(#bgv)"/>
  <circle cx="120" cy="100" r="60" fill="#ffffff" opacity="0.25"/>
  <!-- floating spatial UI cards -->
  <g>
    <rect x="70" y="250" width="170" height="120" rx="20" fill="url(#glass)"/>
    <rect x="92" y="276" width="92" height="14" rx="7" fill="#3a9fe0"/>
    <rect x="92" y="302" width="126" height="9" rx="4.5" fill="#bfe2f7"/>
    <rect x="92" y="320" width="100" height="9" rx="4.5" fill="#bfe2f7"/>
    <rect x="500" y="120" width="160" height="110" rx="20" fill="url(#glass)"/>
    <circle cx="540" cy="160" r="18" fill="#3a9fe0"/>
    <rect x="568" y="150" width="74" height="11" rx="5.5" fill="#3a9fe0"/>
    <rect x="520" y="190" width="120" height="9" rx="4.5" fill="#bfe2f7"/>
  </g>
  <!-- headset -->
  <g transform="translate(360,250)">
    <rect x="-150" y="-70" width="300" height="150" rx="70" fill="url(#visor)"/>
    <rect x="-128" y="-50" width="256" height="110" rx="55" fill="#3a4150" opacity="0.7"/>
    <ellipse cx="0" cy="6" rx="118" ry="44" fill="#6fb7e8" opacity="0.55"/>
    <path d="M-150 0 q-40 -6 -52 30" stroke="#2c2f3a" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M150 0 q40 -6 52 30" stroke="#2c2f3a" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  <text x="40" y="64" font-family="Poppins, Verdana, sans-serif" font-size="40" font-weight="700" fill="#f4fbff">Vision Pro Prototype</text>
</svg>
