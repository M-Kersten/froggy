    <path d="M210 120 L210 96 L290 96 L290 120 Z" fill="#c2703f"/>
    <rect x="300" y="160" width="74" height="160" rx="6" fill="#f4e3c1"/>
    <path d="M300 160 L337 128 L374 160 Z" fill="#d98b53"/>
    <rect x="384" y="130" width="80" height="190" rx="6" fill="#e8cfa6"/>
    <path d="M384 130 L384 104 L464 104 L464 130 Z" fill="#c2703f"/>
    <rect x="474" y="158" width="78" height="162" rx="6" fill="#f4e3c1"/>
