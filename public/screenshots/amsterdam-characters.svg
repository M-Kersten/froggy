  </g>
  <!-- canal -->
  <rect x="0" y="320" width="720" height="130" fill="url(#water)"/>
  <g stroke="#5b86b8" stroke-width="4" opacity="0.6" fill="none">
    <path d="M40 360 q40 -12 80 0 t80 0 t80 0 t80 0"/>
