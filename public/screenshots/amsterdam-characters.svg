      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="1" stop-color="#ff7e5c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6ea5"/>
      <stop offset="1" stop-color="#2b557f"/>
